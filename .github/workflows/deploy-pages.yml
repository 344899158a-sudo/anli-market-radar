name: 更新统一版行情并部署 Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-market]
  schedule:
    - cron: "11,26,41,56 * * * 1-5"
    - cron: "37 0 * * 0,6"

permissions:
  contents: read

concurrency:
  group: anli-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 读取统一版代码
        uses: actions/checkout@v4

      - name: 使用 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 使用 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 恢复私有行情历史缓存
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: .runtime/market_history_cache.json
          key: anli-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            anli-history-${{ runner.os }}-

      - name: 运行公开版 Python 回归
        run: >-
          python -m unittest -v
          tests.test_advanced_technical
          tests.test_bootstrap_restore
          tests.test_calendar_fallback
          tests.test_event_calendar
          tests.test_history_cache
          tests.test_nasdaq_kline
          tests.test_public_market_ohlcv
          tests.test_public_release
          tests.test_public_release_export
          tests.test_public_site_build
          tests.test_public_snapshot
          tests.test_public_snapshot_quality
          tests.test_status_cache
          tests.test_v2_data_source
          tests.test_v2_engine
          tests.test_v2_overlay
          tests.test_v3_runtime
          tests.test_v31_runtime
          tests.test_v31_overlay
          tests.test_watchlist_config

      - name: 检查 Python 与浏览器脚本
        shell: bash
        run: |
          python -m compileall -q src tools
          for file in web/*.js; do node --check "$file"; done
          node --test tests/public_adapter.test.mjs
          node --test tests/v3_frontend.test.mjs tests/v31_frontend.test.mjs
          node --test cloudflare-worker/test/*.test.js

      - name: 生成并验证真实公开快照
        id: live_release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: >-
          python tools/export_public_release.py .site
          --runtime .runtime
          --timeout-seconds 840

      - name: 实时快照失败时仅更新已核验事件日历
        id: calendar_fallback
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          steps.live_release.outcome == 'failure'
        continue-on-error: true
        run: >-
          python tools/export_calendar_fallback.py .site
          --base-url https://344899158a-sudo.github.io/anli-market-radar/

      - name: 统一版线上基线缺失时恢复已验证启动快照
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          steps.live_release.outcome == 'failure' &&
          steps.calendar_fallback.outcome == 'failure'
        run: >-
          python tools/restore_bootstrap_release.py
          .site .github/bootstrap/public-release.zip

      - name: 再次核对发布物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python tools/validate_public_release.py .site/data

      - name: 生成 ANLI 2.1 决策层与完整详情页
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python tools/build_v2_overlay.py .site

      - name: 生成 ANLI 3.0 与 3.1 只读脱敏层
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python tools/build_v31_overlay.py .site

      - name: 配置 GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: 上传已验证的统一版网站
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布公开网址
        id: deployment
        uses: actions/deploy-pages@v4
