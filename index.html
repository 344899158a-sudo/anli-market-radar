<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020d09" />
    <meta
      name="description"
      content="ANLI QQQ 大盘状态、日K技术图与未来四周重大事件风险雷达"
    />
    <title>ANLI · QQQ大局观</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <div>
        <span>ANLI · MARKET RADAR</span>
        <h1>今天的大局观</h1>
      </div>
      <div class="header-actions">
        <button id="alert-button" type="button">开启页内提醒</button>
        <button id="refresh-button" type="button">刷新</button>
      </div>
    </header>

    <main id="app" class="page-shell">
      <div class="loading-card" role="status">
        <span class="pulse-dot"></span>
        正在读取QQQ日K与未来事件…
      </div>
    </main>

    <aside id="reminder" class="reminder" role="alert" hidden>
      <div>
        <strong id="reminder-title"></strong>
        <span id="reminder-body"></span>
      </div>
      <button id="reminder-close" type="button">知道了</button>
    </aside>

    <script type="module" src="./app.js"></script>
  </body>
</html>
